[package]
name = "crypto-vanity-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand-std"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
bs58 = "0.5"
bech32 = "0.11"
sha2 = "0.10"
ripemd = "0.1"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
ratatui = "0.30.2"
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
